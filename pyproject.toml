[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expanded-garage"
version = "1.4.6"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1", "Pillow>=11.3"]

[project.scripts]
expanded-garage = "expanded_garage.__main__:main"

[tool.setuptools]
packages = ["expanded_garage"]
py-modules = ["fh4_carbin", "fh4_modelbin_geometry", "fh4_asset_probe", "fm4_bumper_obj", "fh4_gamedb"]
package-dir = {"" = "tools", expanded_garage = "expanded_garage"}

[tool.setuptools.package-data]
expanded_garage = ["vehicle-ir-v1.schema.json", "fh4-shift-profiles-v1.json", "fh4-driver-rig-v1.json", "fh4-autovista-v1.json", "fh4-material-parameters-v1.json", "fh4-paint-palette-v1.json", "fh4-locator-guids-v1.json", "fh4-render-buckets-v1.json", "fh4-vertex-colors-v1.json", "fh4-material-flags-v1.json", "fh4-material-atst-v1.json", "fh4-lamp-parameters-v1.json", "fh4-light-rig-v1.json", "fh4-ground-ao-v1.json", "fh4-gauge-parameters-v1.json", "fh4-gauge-graph-v1.json", "LICENSE-FORZATECH-STUDIO.txt"]
